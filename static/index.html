<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173B36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<title>PoliReport</title>
<style>
:root{
  --bg:#F1F5F2; --surface:#fff; --ink:#16262A; --muted:#5C6E70; --line:#DAE3DF;
  --pizarra:#173B36; --sun:#FFC93C; --sun-ink:#2B2100;
  --primary:#173B36; --on-primary:#fff; --accent:#12776A; --accent-soft:#DDF0EB;
  --alta:#D64533; --media:#B87700; --baja:#23895A;
  --s1:#9A6B00; --s2:#1D55B3; --s3:#16764B;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B1412; --surface:#13221E; --ink:#E7F0EC; --muted:#91A8A1; --line:#213731;
    --pizarra:#10302A; --primary:#FFCE4D; --on-primary:#2B2100; --accent:#5FD0BC; --accent-soft:#16342F;
    --alta:#FF7A68; --media:#F0B040; --baja:#55CC92; --s1:#FFCE4D; --s2:#8CB0FF; --s3:#5FD39B;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);letter-spacing:-.02em;margin:0}
h2{font-size:1.2rem;margin:26px 0 12px}
.muted{color:var(--muted)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* ---------- encabezado (pizarra con cuadrícula de cuaderno) ---------- */
.top,.auth{background-color:var(--pizarra);color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:24px 24px}
.top{position:relative;padding:calc(var(--safe-t) + 22px) 16px 54px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;background:var(--bg);border-radius:26px 26px 0 0}
.top .in{max-width:640px;margin:0 auto}
.top h1{font-size:clamp(1.7rem,7vw,2.15rem);line-height:1.08;font-weight:800}
.top p{margin:6px 0 0;color:rgba(255,255,255,.78);max-width:34ch}
.body{max-width:640px;margin:0 auto;padding:2px 16px calc(120px + var(--safe-b))}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stat{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.16);border-radius:16px;padding:11px 12px;color:#fff;text-align:left;
  display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1;font-weight:800}
.stat span{font-size:.8rem;color:rgba(255,255,255,.78);font-weight:600}
.stat[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.stat[aria-pressed=true] span{color:var(--sun-ink)}

/* ---------- formularios ---------- */
.field{display:block;margin:18px 0}
.lbl{display:block;font-weight:700;font-size:.92rem;margin-bottom:8px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
textarea{min-height:104px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:1rem}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{width:auto;display:inline-flex;padding:11px 18px}
.err{color:var(--alta);font-size:.92rem;font-weight:600;min-height:1.3em;margin:10px 0}
.filters{display:grid;grid-template-columns:1fr 128px;gap:8px;margin:6px 0 14px}
.search{position:relative;display:block}
.search .i{position:absolute;left:13px;top:50%;margin-top:-11px;color:var(--muted)}
.search input{padding-left:42px;border-radius:99px}
.filters select{border-radius:99px;padding-left:16px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem}
.opt .i{width:18px;height:18px}
.opt input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.urg{display:grid;gap:8px}
.u{position:relative;display:block}
.u input{position:absolute;opacity:0}
.u>span{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.u>span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.u b{display:block;line-height:1.2} .u small{color:var(--muted)}
.u.Alta{--c:var(--alta)} .u.Media{--c:var(--media)} .u.Baja{--c:var(--baja)}
.u input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.u input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:132px;padding:16px;
  border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:18px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.drop .i{width:30px;height:30px}
.drop b{color:var(--ink)} .drop small{color:var(--muted)}
.drop img{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:6px}

/* ---------- lista ---------- */
.list{display:grid;gap:10px}
.card{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px}
.card:active{transform:scale(.99)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.ico.Alta{--c:var(--alta)} .ico.Media{--c:var(--media)} .ico.Baja{--c:var(--baja)} .ico.ok{--c:var(--baja)}
.txt{min-width:0;flex:1}
.t{display:block;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:.84rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s1{--c:var(--s1)} .pill.s2{--c:var(--s2)} .pill.s3{--c:var(--s3)}
.prio{font-weight:700} .prio.Alta{color:var(--alta)} .prio.Media{color:var(--media)} .prio.Baja{color:var(--baja)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ico{margin:0 auto 12px;width:56px;height:56px;border-radius:50%}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin:16px auto 0}

/* ---------- línea de estado ---------- */
.track{list-style:none;display:flex;margin:6px 0 0;padding:0}
.track li{flex:1;font-size:.8rem;color:var(--muted);position:relative;padding-top:24px;text-align:center;font-weight:600}
.track li::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:4px;border-radius:4px;background:var(--line)}
.track li:first-child::before{display:none}
.track li span{position:absolute;top:3px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line);z-index:1}
.track li.done::before,.track li.now::before{background:var(--accent)}
.track li.done span,.track li.now span{background:var(--accent)}
.track li.now{color:var(--ink);font-weight:700}
.track li.now span{box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 60%,transparent)}
.track.fin li.done::before,.track.fin li.now::before{background:var(--baja)}
.track.fin li.done span,.track.fin li.now span{background:var(--baja)}

/* ---------- navegación inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-radius:24px 24px 0 0;
  box-shadow:0 -6px 24px rgba(10,30,26,.12);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;align-items:flex-end;max-width:640px;margin:0 auto;padding:0 8px}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-size:.74rem;font-weight:700;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .pillbg{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
nav.tabs button[aria-current=page]{color:var(--accent)}
nav.tabs button[aria-current=page] .pillbg{background:var(--accent-soft)}
nav.tabs .fab .pillbg{width:58px;height:58px;border-radius:50%;background:var(--sun);color:var(--sun-ink);margin-top:-26px;
  box-shadow:0 6px 16px rgba(255,201,60,.45),0 0 0 5px var(--surface)}
nav.tabs .fab[aria-current=page] .pillbg{background:var(--sun)}
nav.tabs .fab .i{width:28px;height:28px;stroke-width:2.6}
nav.tabs .fab{color:var(--ink)}

/* ---------- detalle ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:var(--safe-t)}
.sheet .in{max-width:640px;margin:0 auto;padding:8px 16px calc(36px + var(--safe-b))}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:700;padding:10px 0}
.sheet h1{font-size:1.6rem;line-height:1.15;font-weight:800;margin:6px 0 12px}
.photo{width:100%;border-radius:20px;display:block;max-height:320px;object-fit:cover;margin:6px 0 14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.box>b{font-family:var(--f-display);font-size:1.05rem}
dl{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;margin:2px 0}
dt{color:var(--muted);font-size:.9rem} dd{margin:0;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(28px);opacity:0}}
  .toast{animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
}

/* ---------- panel / cuenta ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;border-top:4px solid var(--c)}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:800}
.kpi small{color:var(--muted);font-weight:600}
.kpi.s1{--c:var(--s1)} .kpi.s2{--c:var(--s2)} .kpi.s3{--c:var(--s3)}
.bars{display:grid;gap:11px}
.bar .lbl2{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px;font-weight:600}
.bar .tr{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:var(--c,var(--accent))}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.me{display:flex;align-items:center;gap:16px}
.me b{font-family:var(--f-display);font-size:1.25rem;display:block}

/* ---------- inicio de sesión ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column}
.auth-top{padding:calc(var(--safe-t) + 44px) 24px 34px;max-width:640px;width:100%;margin:0 auto}
.mark{width:58px;height:58px;border-radius:17px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;margin-bottom:22px}
.mark .i{width:32px;height:32px;stroke-width:2.6}
.auth-top h1{font-size:2.5rem;font-weight:800;line-height:1}
.auth-top p{margin:10px 0 0;color:rgba(255,255,255,.82);font-size:1.08rem;max-width:26ch}
.auth-card{flex:1;background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 20px calc(28px + var(--safe-b))}
.auth-card .in{max-width:440px;margin:0 auto}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg2 button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,30,26,.12)}

.picker{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.pk-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pk-txt{flex:1;min-width:0}.pk-txt b{display:block;line-height:1.2}.pk-txt small{color:var(--muted)}
.picker>.i:last-child{color:var(--muted)}
.picker-sheet{z-index:12;padding-top:0}
.pk-head{position:sticky;top:0;z-index:1;background:var(--bg);padding:calc(var(--safe-t) + 6px) 0 12px}
.pk-head h1{font-size:1.45rem;margin:2px 0 12px}
.grp{display:flex;justify-content:space-between;align-items:baseline;font-size:1rem;margin:22px 0 8px;color:var(--accent)}
.grp span{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:600}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.long{grid-column:1/-1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:.94rem;line-height:1.25}
.row.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.top .in{position:relative}
.top h1{padding-right:54px}
.bell{position:absolute;right:0;top:-2px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.badge2{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--sun);color:var(--sun-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--pizarra)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;padding:11px 14px;border-radius:14px;background:color-mix(in srgb,var(--sun) 30%,var(--surface));font-weight:600;font-size:.92rem}
.banner.off{background:color-mix(in srgb,var(--alta) 14%,var(--surface))}
.banner .link{background:none;border:0;color:var(--accent);font-weight:800;padding:2px 0;white-space:nowrap}
.sim{margin:0 0 18px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 55%,var(--line))}
.sim p{margin:2px 0 10px;font-size:.9rem}
.sim-item{padding:10px 0;border-top:1px solid color-mix(in srgb,var(--sun) 40%,var(--line))}
.sim-item .t2{font-weight:700;line-height:1.3}
.extra{z-index:11}
.aviso{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:8px}
.aviso .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.aviso.nuevo{border-color:var(--accent);background:var(--accent-soft)}
.aviso.nuevo .dot{background:var(--accent)}
.aviso small{display:block;color:var(--muted);margin-top:2px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.ba figure{margin:0}.ba img{width:100%;height:170px;object-fit:cover;border-radius:16px;display:block}
.ba figcaption{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px;text-align:center}
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{position:relative;padding:0 0 16px 38px}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .pt{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tl .pt .i{width:16px;height:16px}
.tl b{display:block;font-size:.92rem;line-height:1.3}
.tl small{color:var(--muted)}
.bub{margin-top:4px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap}
.comentar{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.comentar textarea{min-height:46px;height:46px;border-radius:14px;padding:11px 14px}
.comentar .btn{width:auto;padding:13px 16px}
.drop.mini{min-height:96px}
.kpi.wide{grid-column:span 3;display:flex;justify-content:space-between;align-items:center}
.kpi.wide b{display:inline;font-size:1.5rem}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.exp .field{margin:0;min-width:0}
.exp input{min-width:0;max-width:100%}
.badge2[hidden]{display:none}
.acts{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.acts .link,.del{background:none;border:0;font-weight:700;color:var(--accent);padding:4px 0}
.acts .del{color:var(--alta)}
.card.nohover:active{transform:none}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:99px;font-weight:700;z-index:20;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="extra"></div>
<div id="picker"></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = {user:null, cat:null, tab:"reportes", f:{estado:"",prioridad:"",q:""}, all:[], stats:null, historial:[], foto:null, authMode:"login", loading:false, detalle:null, areaSel:null, avisos:{no_leidos:0, items:[]}, offline:false, sim:[], fotoDespues:null, gest:null};
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
const cola = () => LS.get("pr_cola", []);

/* ---------- íconos ---------- */
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  list: svg('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  chart: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  camera: svg('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  back: svg('<path d="M15 5l-7 7 7 7"/>'),

/* ---------- utilidades ---------- */
async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch("/api" + path, {
      method: opts.method || "GET", credentials: "same-origin",
      headers: opts.body ? {"Content-Type":"application/json"} : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch { state.offline = true; refreshBanner(); const e = new Error("Sin conexión"); e.offline = true; throw e; }
  if (state.offline) { state.offline = false; refreshBanner(); setTimeout(enviarCola, 300); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && state.user) { state.user = null; render(); }
    throw new Error(data.error || "No se pudo completar la acción");
  }
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = "", 2600);
}
const fmtHora = s => s ? new Date(s.replace(" ", "T") + "Z").toLocaleString("es-DO", {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"}) : "";
const fmtDur = h => h == null ? "-" : h < 24 ? h.toFixed(1) + " h" : (h / 24).toFixed(1) + " días";
const fmt = s => s ? new Date(s.replace(" ", "T") + "Z").toLocaleDateString("es-DO", {day:"numeric", month:"short"}) : "";
const primer = n => (n || "").trim().split(/\s+/)[0] || "";
const iniciales = n => (n || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

const pill = id => `<span class="pill ${ESTADO[id][1]}">${ESTADO[id][0]}</span>`;

function filtrados() {

function bannerHTML() {
  const n = cola().length;

    (n ? `<div class="banner"><span>${n === 1 ? "1 reporte guardado sin enviar" : n + " reportes guardados sin enviar"}</span><button class="link" data-act="enviar-cola">Enviar ahora</button></div>` : "");
}
function refreshBanner() { const b = $("#banner"); if (b) b.innerHTML = bannerHTML(); }
async function enviarCola() {
  let q = cola(), enviados = 0;
  if (!q.length || !state.user || state.enviando) return;
  state.enviando = true;
  for (const it of [...q]) {
    try { await api("/reportes", {method:"POST", body:it.body}); q = q.filter(x => x.id !== it.id); enviados++; }
    catch (e) { if (e.offline) break; q = q.filter(x => x.id !== it.id); toast("Un reporte guardado no se pudo enviar: " + e.message); }
  }
  LS.set("pr_cola", q); state.enviando = false; refreshBanner();
  if (enviados) { toast(enviados === 1 ? "Se envió el reporte guardado" : `Se enviaron ${enviados} reportes guardados`); cargarReportes(); }
}
async function cargarReportes() {
  state.loading = !state.all.length;

function reducirImagen(file, max = 1000) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL("image/jpeg", .72));
    };
    img.onerror = () => fail(new Error("No se pudo leer la foto"));
    img.src = url;
  });
}

function cerrarDetalle() { $("#overlay").innerHTML = ""; document.body.style.overflow = ""; state.detalle = null; state.fotoDespues = null; }
const fotoDBox = () => state.fotoDespues
  ? `<img src="${state.fotoDespues}" alt="Vista previa de la foto del arreglo"><small>Toca para cambiar</small>`
  : `${I.camera}<b>Foto del arreglo</b><small>Opcional</small>`;
const ICO_EV = {creado:I.plus, estado:I.check, asignado:I.user, prioridad:I.alert, comentario:I.chat, foto:I.camera};
async function abrirDetalle(id) {
  let r; try { r = await api("/reportes/" + id); } catch (e) { return toast(e.message); }
  const u = state.user, c = state.cat, admin = u.rol === "admin", edita = admin || u.rol === "mantenimiento";
  const prev = document.querySelector("#overlay .sheet"), scroll = prev && state.detalle && state.detalle.id === id ? prev.scrollTop : 0;
  state.detalle = {id, admin}; if (!prev) state.fotoDespues = null;
  $("#overlay").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Detalle del reporte"><div class="in">
    <button class="back" data-act="close">${I.back}Volver</button>
    ${r.foto_despues ? `<div class="ba" style="grid-template-columns:${r.foto ? "1fr 1fr" : "1fr"}">${r.foto ? `<figure><img src="${r.foto}" alt="Antes"><figcaption>Antes</figcaption></figure>` : ""}<figure><img src="${r.foto_despues}" alt="Después"><figcaption>Después</figcaption></figure></div>`
      : r.foto ? `<img class="photo" src="${r.foto}" alt="Foto del problema">` : ""}
    <h1>${esc(r.descripcion)}</h1>
    <div class="m" style="margin:0 0 4px">${pill(r.id_estado)}<span class="prio ${r.prioridad}">Urgencia ${r.prioridad.toLowerCase()}</span>${r.apoyos ? `<span>${r.apoyos} ${r.apoyos === 1 ? "persona más reportó" : "personas más reportaron"} lo mismo</span>` : ""}</div>
    <div class="box"><b>Avance</b>${track(r.id_estado)}</div>
    <div class="box"><dl><dt>Área</dt><dd>${esc(r.lugar)}</dd><dt>Tipo</dt><dd>${esc(r.categoria)}</dd>${r.problema ? `<dt>Problema</dt><dd>${esc(r.problema)}</dd>` : ""}${r.curso ? `<dt>Curso</dt><dd>${esc(r.curso)}</dd>` : ""}
      <dt>Reportado por</dt><dd>${esc(r.autor)}, ${fmt(r.fecha)}</dd>
      <dt>Encargado</dt><dd>${esc(r.encargado || "Sin asignar")}</dd>
      ${r.fecha_resuelto ? `<dt>Resuelto</dt><dd>${fmt(r.fecha_resuelto)}</dd>` : ""}</dl></div>
    ${edita ? `<form class="box" id="editForm"><b>Actualizar reporte</b>
      ${admin ? `<label class="field"><span class="lbl">Encargado</span><select name="id_encargado"><option value="">Sin cambios</option>${c.encargados.map(e =>
        `<option value="${e.id_encargado}" ${r.id_encargado === e.id_encargado ? "selected" : ""}>${esc(e.nombre)} (${esc(e.especialidad || "")})</option>`).join("")}</select></label>
      <label class="field"><span class="lbl">Urgencia</span><select name="prioridad">${c.prioridades.map(p => `<option ${r.prioridad === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>` : ""}
      <label class="field"><span class="lbl">Estado</span><select name="id_estado">${c.estados.map(e => `<option value="${e.id_estado}" ${r.id_estado === e.id_estado ? "selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></label>
      <div class="field"><span class="lbl">Foto del arreglo</span><label class="drop mini" for="fotoDespues" id="fotoDBox">${fotoDBox()}</label>
        <input class="vh" id="fotoDespues" type="file" accept="image/*" capture="environment"></div>
      <div class="err" id="eErr" role="alert"></div><button class="btn">Guardar cambios</button></form>` : ""}
    <div class="box"><b>Historial</b><ol class="tl">${r.eventos.map(ev => `<li><span class="pt">${ICO_EV[ev.tipo] || I.check}</span>
      ${ev.tipo === "comentario" ? `<b>${esc(ev.autor)}</b><div class="bub">${esc(ev.texto)}</div>` : `<b>${esc(ev.texto)}</b>`}
      <small>${ev.tipo === "comentario" ? "" : esc(ev.autor) + ", "}${fmtHora(ev.fecha)}</small></li>`).join("")}</ol>
      <form class="comentar" id="comentForm"><textarea name="texto" placeholder="Escribe un comentario" aria-label="Comentario" required></textarea><button class="btn">Enviar</button></form></div>
  </div></div>`;
  document.body.style.overflow = "hidden";
  if (prev) document.querySelector("#overlay .sheet").style.animation = "none";
  if (scroll) document.querySelector("#overlay .sheet").scrollTop = scroll;
}

/* ---------- avisos ---------- */
function actualizarBell() {
  const b = $("#bellN"); if (!b) return;
  const n = state.avisos.no_leidos; b.textContent = n > 99 ? "99+" : n; b.hidden = !n;
}
async function cargarAvisos() { try { state.avisos = await api("/avisos"); actualizarBell(); } catch {} }
async function sondeo() {
  if (document.hidden || !state.user || state.offline) return;
  try {
    const r = await api("/avisos/conteo");
    if (r.no_leidos > state.avisos.no_leidos) { toast("Tienes un aviso nuevo"); if (state.tab === "reportes" && !state.detalle) cargarReportes(); }
    state.avisos.no_leidos = r.no_leidos; actualizarBell();
  } catch {}
}
async function abrirAvisos() {
  try { state.avisos = await api("/avisos"); } catch (e) { return toast(e.message); }
  actualizarBell();
  const it = state.avisos.items;
  $("#extra").innerHTML = `<div class="sheet extra" role="dialog" aria-modal="true" aria-label="Avisos"><div class="in">
    <button class="back" data-act="close-extra">${I.back}Volver</button><h1>Avisos</h1>
    ${state.avisos.no_leidos ? `<button class="btn ghost small" data-act="leer-todo" style="margin:10px 0 4px">Marcar todo como leído</button>` : ""}
    <div style="margin-top:14px">${it.length ? it.map(a => `<button class="aviso ${a.leido ? "" : "nuevo"}" data-aviso="${a.id_aviso}" data-rep="${a.id_reporte || ""}"><span class="dot"></span><span class="txt">${esc(a.texto)}<small>${fmtHora(a.fecha)}</small></span></button>`).join("")
      : `<div class="empty"><span class="ico ok">${I.bell}</span><b>Sin avisos</b>Aquí verás cuando cambie el estado de tus reportes.</div>`}</div></div></div>`;
  document.body.style.overflow = "hidden";
}
function cerrarExtra() { $("#extra").innerHTML = ""; document.body.style.overflow = ""; state.gest = null; }

/* ---------- administrar encargados y áreas ---------- */
async function refrescarCatalogo() { state.cat = await api("/catalogos"); LS.set("pr_cache", {user:state.user, cat:state.cat}); }
async function gestEnc() {
  try { state.gest = {tipo:"enc", edit:null, lista: await api("/admin/encargados")}; } catch (e) { return toast(e.message); }
  pintarGest();
}
function gestAreas() { state.gest = {tipo:"areas", edit:null}; pintarGest(); }
function pintarGest() {
  const g = state.gest, enc = g.tipo === "enc", ed = g.edit;
  let form, lista;
  if (enc) {
    const x = ed ? g.lista.find(y => y.id_encargado === ed) : null;
    form = `<form class="box" id="encForm" novalidate><b>${x ? "Editar encargado" : "Agregar encargado"}</b>
      <label class="field"><span class="lbl">Nombre</span><input name="nombre" value="${esc(x ? x.nombre : "")}" required></label>
      <label class="field"><span class="lbl">Especialidad</span><input name="especialidad" value="${esc(x ? x.especialidad || "" : "")}" placeholder="Ej: Electricidad"></label>
      ${x ? (x.correo ? `<label class="field"><span class="lbl">Nueva contraseña (opcional)</span><input name="password" type="password" autocomplete="new-password"></label>` : "")
        : `<label class="field"><span class="lbl">Correo para entrar a la app (opcional)</span><input name="correo" type="email" autocomplete="off"></label>
           <label class="field"><span class="lbl">Contraseña (mín. 6)</span><input name="password" type="password" autocomplete="new-password"></label>`}
      <div class="err" id="gErr" role="alert"></div><button class="btn">${x ? "Guardar" : "Agregar"}</button>
      ${x ? `<button type="button" class="btn ghost" style="margin-top:8px" data-act="gest-cancel">Cancelar</button>` : ""}</form>`;
    lista = g.lista.map(x => `<div class="card nohover"><span class="ico ok">${I.user}</span><span class="txt"><span class="t">${esc(x.nombre)}</span>
      <span class="m"><span>${esc(x.especialidad || "Sin especialidad")}</span><span>${x.correo ? esc(x.correo) : "Sin acceso a la app"}</span><span>${x.abiertos} abiertos</span></span></span>
      <span class="acts"><button class="link" data-act="gest-edit" data-id="${x.id_encargado}">Editar</button><button class="del" data-act="gest-del" data-id="${x.id_encargado}">Borrar</button></span></div>`).join("")
      || `<div class="empty">Aún no hay encargados.</div>`;
  } else {
    const x = ed ? state.cat.lugares.find(y => y.id_lugar === ed) : null;
    const grupos = [...new Set(state.cat.lugares.map(l => l.grupo).filter(Boolean))];
    form = `<form class="box" id="areaForm" novalidate><b>${x ? "Editar área" : "Agregar área"}</b>
      <label class="field"><span class="lbl">Nombre</span><input name="nombre" value="${esc(x ? x.nombre : "")}" placeholder="Ej: Biblioteca" required></label>
      <label class="field"><span class="lbl">Grupo</span><input name="grupo" list="grupos" value="${esc(x ? x.grupo || "" : "")}" placeholder="Ej: Áreas generales"><datalist id="grupos">${grupos.map(v => `<option value="${esc(v)}">`).join("")}</datalist></label>
      <div class="err" id="gErr" role="alert"></div><button class="btn">${x ? "Guardar" : "Agregar"}</button>
      ${x ? `<button type="button" class="btn ghost" style="margin-top:8px" data-act="gest-cancel">Cancelar</button>` : ""}</form>`;
    const gr = {};
    state.cat.lugares.forEach(l => { const k = l.grupo || "Otras áreas"; (gr[k] = gr[k] || []).push(l); });
    lista = Object.keys(gr).map(k => `<h2 class="grp">${esc(k)}<span>${gr[k].length}</span></h2>` + gr[k].map(l =>
      `<div class="card nohover" style="margin-bottom:6px"><span class="txt"><span class="t">${esc(l.nombre)}</span></span><span class="acts" style="flex-direction:row;gap:12px">
      <button class="link" data-act="gest-edit" data-id="${l.id_lugar}">Editar</button><button class="del" data-act="gest-del" data-id="${l.id_lugar}">Borrar</button></span></div>`).join("")).join("");
  }
  const prev = document.querySelector("#extra .sheet");
  $("#extra").innerHTML = `<div class="sheet extra" role="dialog" aria-modal="true" aria-label="${enc ? "Encargados" : "Áreas"}"><div class="in">
    <button class="back" data-act="close-extra">${I.back}Volver</button><h1>${enc ? "Encargados" : "Áreas del centro"}</h1>
    <div style="margin-top:10px">${form}</div><div style="margin-top:18px">${lista}</div></div></div>`;
  document.body.style.overflow = "hidden";
  const nuevo = document.querySelector("#extra .sheet"); if (prev) nuevo.style.animation = "none";
  if (prev && !ed) nuevo.scrollTop = prev.scrollTop;
}

/* ---------- eventos (delegados) ---------- */
function irA(tab) {
  state.tab = tab; render();
  if (tab === "reportes") cargarReportes();
  if (tab === "panel") cargarPanel();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-est],[data-area],[data-apoyo],[data-aviso],[data-act]"); if (!t) return;
  const d = t.dataset;
  if (d.tab) return irA(d.tab);
  if (d.open) return abrirDetalle(d.open);
  if (d.area) {
    const l = state.cat.lugares.find(x => String(x.id_lugar) === d.area);
    state.areaSel = {id: l.id_lugar, nombre: l.nombre, grupo: l.grupo};
    const h = document.querySelector("[name=id_lugar]"); if (h) h.value = l.id_lugar;
    const b = $("#areaBtn"); if (b) b.innerHTML = areaBtn();
    cerrarPicker(); return cargarSimilares();
  }
  if (d.apoyo) {
    try {
      const r = await api(`/reportes/${d.apoyo}/apoyo`, {method:"POST"});
      const s = state.sim.find(x => x.id_reporte === +d.apoyo); if (s) { s.apoyos = r.apoyos; s.yo_apoyo = r.yo_apoyo; }
      $("#simBox").innerHTML = simHTML(); toast(r.yo_apoyo ? "Te sumaste a ese reporte" : "Quitaste tu apoyo");
    } catch (x) { toast(x.message); }
    return;
  }
  if (d.aviso) {
    api("/avisos/leer", {method:"POST", body:{id:+d.aviso}}).then(cargarAvisos).catch(() => {});
    cerrarExtra(); if (d.rep) abrirDetalle(d.rep); return;
  }
  if (d.est) { state.f.estado = String(state.f.estado) === d.est ? "" : d.est; return refreshList(); }
  switch (d.act) {
    case "auth-login": case "auth-registro": state.authMode = d.act.slice(5); return render();
    case "close": return cerrarDetalle();
    case "pick-area": return abrirPicker();
    case "close-picker": return cerrarPicker();
    case "clear": state.f = {estado:"", prioridad:"", q:""}; return render();
    case "nuevo": return irA("nuevo");
    case "avisos": return abrirAvisos();
    case "close-extra": return cerrarExtra();
    case "leer-todo": try { await api("/avisos/leer", {method:"POST", body:{}}); } catch {} return abrirAvisos();
    case "enviar-cola": return enviarCola();
    case "exp-xlsx": case "exp-pdf": {
      const q = new URLSearchParams(); const a = $("#expDesde").value, b = $("#expHasta").value;
      if (a) q.set("desde", a); if (b) q.set("hasta", b);
      const link = document.createElement("a"); link.href = "/api/informe." + d.act.slice(4) + (q.toString() ? "?" + q : ""); link.download = "";
      document.body.appendChild(link); link.click(); link.remove(); return;
    }
    case "gest-enc": return gestEnc();
    case "gest-areas": return gestAreas();
    case "gest-cancel": state.gest.edit = null; return pintarGest();
    case "gest-edit": state.gest.edit = +d.id; pintarGest(); return void ($("#extra .sheet").scrollTop = 0);
    case "gest-del": {
      if (!confirm("¿Seguro que quieres borrarlo?")) return;
      const enc = state.gest.tipo === "enc";
      try {
        await api((enc ? "/admin/encargados/" : "/admin/lugares/") + d.id, {method:"DELETE"});
        if (enc) state.gest.lista = await api("/admin/encargados");
        await refrescarCatalogo(); pintarGest(); toast("Borrado");
      } catch (x) { toast(x.message); }
      return;
    }
    case "logout":
      try { await api("/logout", {method:"POST"}); } catch {}
      Object.assign(state, {areaSel:null, user:null, all:[], stats:null, historial:[], f:{estado:"",prioridad:"",q:""}, foto:null, avisos:{no_leidos:0, items:[]}});
      LS.set("pr_cache", null); LS.set("pr_all", []);
      return render();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "qa") $("#areaList").innerHTML = areaLista(e.target.value.trim());
  if (e.target.id === "q") { clearTimeout(e.target.t); e.target.t = setTimeout(() => { state.f.q = e.target.value.trim(); refreshList(); }, 150); }
});
document.addEventListener("change", async e => {
  if (e.target.name === "id_categoria") { $("#probBox").innerHTML = probChips(e.target.value); cargarSimilares(); }
  if (e.target.id === "fp") { state.f.prioridad = e.target.value; refreshList(); }
  if (e.target.id === "foto" && e.target.files[0]) {
    try { state.foto = await reducirImagen(e.target.files[0]); $("#fotoBox").innerHTML = fotoBox(); } catch (x) { toast(x.message); }
  }
  if (e.target.id === "fotoDespues" && e.target.files[0]) {
    try { state.fotoDespues = await reducirImagen(e.target.files[0]); $("#fotoDBox").innerHTML = fotoDBox(); } catch (x) { toast(x.message); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f)), btn = f.querySelector(".btn");
  if (f.id === "authForm") {
    const reg = state.authMode === "registro"; btn.disabled = true;
    try { state.user = await api(reg ? "/registro" : "/login", {method:"POST", body:d}); await boot(); }
    catch (x) { $("#authErr").textContent = x.offline ? "Necesitas conexión para iniciar sesión." : x.message; btn.disabled = false; }
  }
  if (f.id === "nuevoForm") {
    const er = $("#nErr");
    if (d.descripcion.trim().length < 5) return er.textContent = "Cuéntanos qué pasó (mínimo 5 letras).";
    if (!d.id_lugar) return er.textContent = "Elige dónde está el problema.";
    if (!d.id_categoria) return er.textContent = "Elige el tipo de problema.";
    const body = {descripcion:d.descripcion, id_lugar:+d.id_lugar, id_categoria:+d.id_categoria, prioridad:d.prioridad, foto:state.foto,
                  problema:d.problema || null, curso:(d.curso || "").trim() || null};
    btn.disabled = true;
    const terminar = msg => { try { localStorage.setItem("pr_curso", (d.curso || "").trim()); } catch {}
      state.foto = null; state.areaSel = null; state.sim = []; state.f = {estado:"",prioridad:"",q:""}; toast(msg); irA("reportes"); };
    try { await api("/reportes", {method:"POST", body}); terminar("Reporte enviado"); }
    catch (x) {
      if (x.offline) { LS.set("pr_cola", [...cola(), {id: Date.now(), body}]); terminar("Sin conexión: guardado, se enviará solo"); }
      else { er.textContent = x.message; btn.disabled = false; }
    }
  }
  if (f.id === "editForm") {
    const {id, admin} = state.detalle, body = {id_estado: +d.id_estado};
    if (admin) { body.prioridad = d.prioridad; if (d.id_encargado) body.id_encargado = +d.id_encargado; }
    if (state.fotoDespues) body.foto_despues = state.fotoDespues;
    btn.disabled = true;
    try { await api("/reportes/" + id, {method:"PATCH", body}); cerrarDetalle(); toast("Cambios guardados"); await cargarReportes(); if (admin) cargarPanel(); }
    catch (x) { $("#eErr").textContent = x.message; btn.disabled = false; }
  }
  if (f.id === "comentForm") {
    if (!d.texto.trim()) return;
    btn.disabled = true;
    try { await api(`/reportes/${state.detalle.id}/comentarios`, {method:"POST", body:{texto:d.texto}}); await abrirDetalle(state.detalle.id); }
    catch (x) { toast(x.message); btn.disabled = false; }
  }
  if (f.id === "encForm" || f.id === "areaForm") {
    const enc = f.id === "encForm", g = state.gest; btn.disabled = true;
    try {
      const base = enc ? "/admin/encargados" : "/admin/lugares";
      if (g.edit) await api(base + "/" + g.edit, {method:"PATCH", body:d}); else await api(base, {method:"POST", body:d});
      g.edit = null; if (enc) g.lista = await api("/admin/encargados");
      await refrescarCatalogo(); pintarGest(); toast("Guardado");
    } catch (x) { $("#gErr").textContent = x.message; btn.disabled = false; }
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !state.user) return;
  if (state.tab === "reportes" && !state.detalle) cargarReportes();
  enviarCola(); sondeo();
});
window.addEventListener("online", () => { if (state.user) { enviarCola(); if (state.tab === "reportes") cargarReportes(); } });

/* ---------- arranque ---------- */
async function boot() {
  try {
    if (!state.user) state.user = await api("/yo");
    state.cat = await api("/catalogos");
    LS.set("pr_cache", {user: state.user, cat: state.cat});
    state.tab = "reportes"; state.loading = true; render();
    await cargarReportes(); enviarCola(); cargarAvisos();
    clearInterval(boot.t); boot.t = setInterval(sondeo, 30000);
  } catch (e) {
    const c = e.offline && LS.get("pr_cache", null);
    if (c) { state.user = c.user; state.cat = c.cat; state.all = LS.get("pr_all", []); state.tab = "reportes"; render(); }
    else { state.user = null; render(); }
  }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
boot();
</script>
</body>
</html>
